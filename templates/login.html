{{define "login.html"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inproxy admin · Sign in</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; min-height: 100vh; align-items: center; justify-content: center;
         margin: 0; padding: 1rem; background: #0f172a; color: #e2e8f0; }
  .card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 320px; max-width: 100%;
          box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  h1 { font-size: 1.25rem; margin: 0 0 1.25rem; text-align: center; }
  label { display: block; font-size: .8rem; margin-bottom: .35rem; color: #94a3b8; }
  input { width: 100%; padding: .6rem .7rem; border-radius: 8px; border: 1px solid #334155;
          background: #0f172a; color: #e2e8f0; font-size: 1rem; }
  button { width: 100%; margin-top: 1rem; padding: .65rem; border: 0; border-radius: 8px;
           background: #3b82f6; color: white; font-size: 1rem; cursor: pointer; }
  button:hover { background: #2563eb; }
  .err { color: #f87171; font-size: .85rem; margin-bottom: .75rem; text-align: center; }
</style>
</head>
<body>
  <form class="card" method="post" action="/_admin/login">
    <h1>🔐 inproxy admin</h1>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <label for="password">Admin password</label>
    <input id="password" name="password" type="password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>{{end}}
